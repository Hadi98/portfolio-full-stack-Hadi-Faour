<div
  class="avatar-stage"
  [class.sm]="size === 'sm'"
  [class.md]="size === 'md'"
  [class.lg]="size === 'lg'"
  [class.xl]="size === 'xl'"
  [class.animated]="animated"
  [class.with-glow]="showGlow"
>
  <div class="avatar-shadow"></div>

  <div class="avatar-character">
    <img src="/assets/images/cartoon-avatar.png" alt="Hadi Faour cartoon avatar" />
  </div>

  <div class="avatar-particles particle-1"></div>
  <div class="avatar-particles particle-2"></div>
</div>
